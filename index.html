<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noahs Photoalbum</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: #050505;
      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 520px;
      text-align: center;
    }

    /* Titel */

    #title {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 1px;

      animation: fadeTitle 4s forwards;
    }

    @keyframes fadeTitle {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      25% {
        opacity: 1;
        transform: translateY(0);
      }

      70% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-10px);
      }
    }


    /* Hinweis */

    #permissionBox {
      display: none;

      background: #111111;
      border: 1px solid #292929;

      border-radius: 14px;

      padding: 30px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.5);

      animation: showBox 1.2s ease forwards;
    }

    @keyframes showBox {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    h2 {
      margin-top: 0;

      font-size: 24px;
      font-weight: 500;
    }


    p {
      color: #bdbdbd;

      line-height: 1.6;

      font-size: 15px;
    }


    /* Button */

    button {
      margin-top: 20px;

      width: 100%;

      padding: 14px 20px;

      border: none;
      border-radius: 9px;

      background: #ffffff;
      color: #000000;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.2s,
        background 0.2s;
    }

    button:hover {
      background: #dddddd;
      transform: scale(1.02);
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }


    /* Status */

    #status {
      display: none;

      margin-top: 20px;

      color: #bdbdbd;

      font-size: 14px;
      line-height: 1.6;
    }


    /* Galerie */

    #gallery {
      display: none;

      animation: galleryIn 1s ease forwards;
    }

    @keyframes galleryIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #gallery img {
      width: 100%;
      max-width: 500px;

      border-radius: 12px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.7);
    }

  </style>
</head>


<body>

  <div class="container">


    <!-- TITEL -->

    <div id="title">
      Noahs Photoalbum
    </div>


    <!-- STANDORT-HINWEIS -->

    <div id="permissionBox">

      <h2>
        Zugriff erforderlich
      </h2>

      <p>
        Um auf die folgende Galerie zugreifen zu können,
        muss die Standortfreigabe aktiviert werden.
      </p>

      <p>
        Dein Standort wird zur Überprüfung des Zugriffs
        verwendet. Bitte bestätige die Standortanfrage
        deines Browsers.
      </p>


      <button id="locationButton">
        Standort freigeben & fortfahren
      </button>


      <div id="status"></div>

    </div>


    <!-- GALERIE -->

    <div id="gallery">

      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPICoiufjVMHSTiW3OY25nTeMQ2bxLMkDDodENx_Om9JEq6nMWJKD2LD-4&s=10"
        alt="Noahs Photoalbum"
      >

    </div>


  </div>


<script>

  const title = document.getElementById("title");

  const permissionBox =
    document.getElementById("permissionBox");

  const locationButton =
    document.getElementById("locationButton");

  const status =
    document.getElementById("status");

  const gallery =
    document.getElementById("gallery");


  /*
    Nach dem Intro den Hinweis anzeigen.
  */

  setTimeout(() => {

    title.style.display = "none";

    permissionBox.style.display = "block";

  }, 4300);


  /*
    Standortabfrage
  */

  locationButton.addEventListener("click", () => {

    if (!navigator.geolocation) {

      status.style.display = "block";

      status.textContent =
        "Dein Browser unterstützt leider keine Standortabfrage.";

      return;
    }


    locationButton.disabled = true;

    locationButton.textContent =
      "Standort wird ermittelt...";


    status.style.display = "block";

    status.textContent =
      "Bitte einen Moment warten. Es wird nach einer möglichst genauen Position gesucht.";


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        console.log("Breitengrad:", latitude);
        console.log("Längengrad:", longitude);
        console.log("Genauigkeit:", accuracy, "Meter");


        /*
          Erfolgreiche Standortabfrage.

          Hier könnte später eine Prüfung
          gegen dein Backend erfolgen.
        */


        status.textContent =
          "Standort erfolgreich ermittelt.";


        setTimeout(() => {

          permissionBox.style.display = "none";

          gallery.style.display = "block";

        }, 700);

      },


      function(error) {

        locationButton.disabled = false;

        locationButton.textContent =
          "Standort erneut freigeben";


        status.style.display = "block";


        if (error.code === 1) {

          status.textContent =
            "Die Standortfreigabe wurde verweigert. Bitte erlaube den Standortzugriff in deinem Browser.";

        }

        else if (error.code === 2) {

          status.textContent =
            "Der Standort konnte momentan nicht ermittelt werden.";

        }

        else if (error.code === 3) {

          status.textContent =
            "Die Standortabfrage hat zu lange gedauert. Bitte versuche es erneut.";

        }

        else {

          status.textContent =
            "Bei der Standortabfrage ist ein Fehler aufgetreten.";

        }

      },


      {
        enableHighAccuracy: true,
        timeout: 60000,
        maximumAge: 0
      }

    );

  });

</script>

</body>
</html>
